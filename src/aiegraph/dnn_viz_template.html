<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
// the board the page describes (pages written before the board table: VEK280)
const TGT = D.target || {key: "vek280", name: "VEK280", host: "Arm Cortex-A72", host_short: "A72", array: "AIE-ML (xcve2802)"};
const HOST = TGT.host_short;
// shim channel label: AIE-ML pages map the stream port to a DMA channel, other arrays show the port
const chl = s => TGT.key === "vek280" ? `ch${s.shim[1]}` : `port ${s.shim[1]}`;
document.getElementById("hostlbl").textContent = HOST;
const NS = "http://www.w3.org/2000/svg";
const LANEW = 250, ROWH = 46, NW = 232, NH = 36, TOP = 6;
let sel = -1, filt = "all", zoom = 1, matches = [];

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fb(b) {
  if (b == null) return "-";
  const u = ["B", "KB", "MB", "GB"]; let i = 0, v = b;
  while (v >= 1024 && i < 3) { v /= 1024; i++; }
  return (i ? v.toFixed(v < 10 ? 2 : 1) : v) + " " + u[i];

function fn(n) { return n == null ? "-" : Number(n).toLocaleString("en-US"); }

  if (l.space === "arena") return `DDR arena @${fn(l.off)} (+${fb(l.size)})`;
  if (l.space === "blob") return `const blob @${fn(l.off)}`;
  if (l.space === "input") return `input in blob @${fn(l.off)}`;
  return "not referenced";
}
function consumers(root) {
  const out = [];
  D.ops.forEach((o, i) => { if (o.args.some(a => a.role !== "out" && T(a.t).root === root)) out.push(i); });
  return out;

const X = o => 14 + o.lane * LANEW, Y = i => TOP + (i + 1) * ROWH;

/* ── header ─────────────────────────────────────────────────────────── */
function header() {
  const S = D.summary, B = D.board;
  document.getElementById("title").textContent = D.title;
  document.getElementById("subtitle").innerHTML =
    `model <b>${esc(D.model)}</b> &middot; mode <b>${esc(D.mode)}</b> &middot; generated ${esc(D.generated)} &middot; time: ` +
    (D.time_source === "board" ? `board log <span class="mono">${esc(B.path)}</span>` :
     D.time_source === "x86" ? "workstation emulation, per op (not board time)" : "not measured") +
    `<br><span class="note">On the board, every host-side (CPU) op runs on the <b>${esc(TGT.host)}</b>. ` +
    `"Emulation" is this page's own run on the workstation that generated it: the same runtime and dispatch, with each AIE kernel ` +
    `replaced by its C reference. It supplies the per-op call / opcode counts; its times are not board times.</span>` +
    (B && B.stale ? `<br><span class="warn">board log ran a different lowering (${B.model.ops} primitives vs ${D.ops.length} here, e.g. before epilogue fusion): its per-implementation times and op counts are not this graph's; GEMM launches still compare</span>` : "");
  const pct = S.ops ? (100 * S.aie_ops / S.ops).toFixed(1) : 0;
  const cards = [
    [fn(S.ops), "primitives"], [`${S.aie_ops} (${pct}%)`, "ops on AIE"],
    S.counted_launches != null ? [fn(S.counted_launches), "AIE entry calls (counted in emulation; an n-tile / MMT layer is one call per layer)"]
      : [fn(S.launches) + (S.board_launches != null ? ` / ${fn(S.board_launches)}` : ""), "AIE launches est." + (S.board_launches != null ? " / board" : "")],
    [fb(S.dma_in) + " / " + fb(S.dma_out), "DDR→AIE / AIE→DDR"],
    [(S.macs ? (100 * S.aie_macs / S.macs).toFixed(1) : "0") + "%", "GEMM MACs on AIE"],
    [fb(D.memory.arena), "activation arena"], [fb(D.memory.consts), "constants"],

  if (S.board_ms != null) cards.push([fms(S.board_ms), B.stale ? "board time (other lowering)" : "board time (prims)"]);
  if (S.x86_ms != null && D.time_source === "x86") cards.push([fms(S.x86_ms), "emulation time (not board)"]);
  document.getElementById("cards").innerHTML = cards.map(c => `<div class="card"><div class="v">${c[0]}</div><div class="k">${c[1]}</div></div>`).join("");
}

/* ── flow graph ─────────────────────────────────────────────────────── */
function edgePath(p, i) {
  const xp = p < 0 ? 14 : X(D.ops[p]), yp = p < 0 ? TOP : Y(p), xc = X(D.ops[i]), yc = Y(i);
  const a = xp + NW / 2, b = xc + NW / 2, y0 = yp + NH;
  if (a === b) return `M${a},${y0} V${yc}`;
  const yb = Math.max(y0, yc - ROWH + NH - 2);
  return `M${a},${y0} V${yb} C${a},${yc - 4} ${b},${yb + 4} ${b},${yc}`;
}
function flow() {
  const svg = document.getElementById("flow");
  const lanes = Math.max(1, ...D.ops.map(o => o.lane + 1));
  const W = 28 + lanes * LANEW, H = Y(D.ops.length) + 20;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.dataset.w = W; svg.dataset.h = H;
  const ge = el("g", {}, svg), gn = el("g", {}, svg);
  D.edges.forEach((e, k) => {
    const w = Math.max(1, Math.min(4, Math.log10(Math.max(e.bytes, 10)) - 1.5));
    const p = el("path", {d: edgePath(e.src, e.dst), class: "edge", "stroke-width": w.toFixed(2), id: "e" + k}, ge);
    el("title", {}, p).textContent = e.tensors.map(t => `t${t} ${shp(T(t))} ${T(t).dt} ${fb(T(t).bytes)}`).join("\n") +
      `\n${e.src < 0 ? "model input" : "#" + e.src} → #${e.dst}`;
  });
  const it = T(D.input);
  const gi = el("g", {transform: `translate(14,${TOP})`}, gn);
  el("rect", {width: NW, height: NH, rx: 6, fill: "var(--grid)", stroke: "var(--line)"}, gi);
  el("text", {x: 10, y: 14, class: "t1", "font-size": 12, "font-weight": 600}, gi).textContent = "model input";
  el("text", {x: 10, y: 27, "font-size": 10.5, fill: "var(--text-secondary)"}, gi).textContent = `${shp(it)} ${it.dt} ${fb(it.bytes)}`;
  D.ops.forEach((o, i) => {
    const g = el("g", {class: `node ${o.place}`, transform: `translate(${X(o)},${Y(i)})`, id: "n" + i}, gn);
    g.dataset.op = i;
    el("rect", {class: "box", width: NW, height: NH, rx: 6}, g);
    el("rect", {width: 5, height: NH, rx: 2, fill: o.place === "aie" ? "var(--aie)" : "var(--cpu)"}, g);
    const out = T(o.out);
    const opc = opcodeText(o), badge = opc || (o.gemm && o.gemm.launches ? "×" + o.gemm.launches : ""), hasB = !!badge;
    if (hasB) el("text", {x: NW - 6, y: 15, class: "badge", "text-anchor": "end"}, g).textContent = badge;
    fit(el("text", {x: 11, y: 15, class: "t1"}, g), `#${i} ${o.name}`, NW - 16 - (hasB ? 7 * badge.length + 6 : 0));
    fit(el("text", {x: 11, y: 29, class: "t2"}, g), `${o.kind}${o.fused.length ? " +" + o.fused.length + " fused" : ""} · ${o.impl} · ${shp(out)} ${out.dt}`, NW - 16);
    el("title", {}, g).textContent = `#${i} ${o.name}\n${o.fn}\nimpl ${o.impl}\nout ${shp(out)} ${out.dt} ${fb(out.bytes)} @ ${locstr(out.loc)}` +
      (o.fused.length ? `\nfused: ${o.fused.join(", ")}` : "") +
      (o.opcodes.length ? "\nmegakernel: " + o.opcodes.map(c => `${c.entry} ${c.opcodes.join("/")} ×${c.calls}`).join(", ") : "");
    g.addEventListener("click", () => select(i, false));
  });
  const oo = D.ops.findIndex(o => o.out === D.output || T(o.out).root === T(D.output).root);
  if (oo >= 0) {
    const t = el("text", {x: X(D.ops[oo]) + NW + 6, y: Y(oo) + 22, "font-size": 11, fill: "var(--text-secondary)"}, gn);
    t.textContent = "← model output";
  }

}
function fit(t, s, w) {
  t.textContent = s;
  if (!t.getComputedTextLength || t.getComputedTextLength() <= w) return;

  while (lo < hi) { const m = (lo + hi + 1) >> 1; t.textContent = s.slice(0, m) + "…"; if (t.getComputedTextLength() <= w) lo = m; else hi = m - 1; }
  t.textContent = s.slice(0, lo) + "…";
}
function applyZoom() {
  const svg = document.getElementById("flow");

}

/* ── details panel ──────────────────────────────────────────────────── */
function argRows(o) {
  return o.args.map(a => {
    const t = T(a.t), from = a.role === "out" ? consumers(t.root).filter(j => j !== o.i).slice(0, 6).map(oplink).join(", ") || (t.root === T(D.output).root ? "model output" : "-")

    const alias = t.base != null ? `<br><span class="note">view of t${t.root} ${shp(T(t.root))}</span>` : "";
    return `<tr><td class="mono" style="white-space:nowrap">${esc(a.arg)}</td><td><span class="mono" style="white-space:nowrap">t${t.id} ${shp(t)} ${t.dt}</span><br><b>${fb(a.bytes)}</b>${alias}</td>` +

}
function gemmBlock(o) {

    `<tr><td>MACs</td><td>${fn(g.macs)}</td></tr>`;

      `<tr><td>launches (est.)</td><td><b>${fn(g.launches)}</b> = ${g.gemms} × ${g.per_gemm_launches}</td></tr>` +
      `<tr><td>block utilization</td><td>${(100 * g.util).toFixed(1)}% (rest is M/N/K zero padding)</td></tr>` +
      `<tr><td>DDR → AIE (shim MM2S)</td><td>${fb(g.dma_in)} = ${g.launches} × (A ${fb(B.a_stage)} + B ${fb(B.b_stage)} staged)</td></tr>` +
      `<tr><td>AIE → DDR (shim S2MM)</td><td>${fb(g.dma_out)} = ${g.launches} × C ${fb(B.c_stage)}</td></tr>` +
      `<tr><td>useful operands</td><td>A ${fb(g.useful_a)}, B ${fb(g.useful_b)}, C ${fb(g.useful_c)} (s32)</td></tr>` +
      (g.host_col ? `<tr><td>host ${g.form} matrix</td><td>${fb(g.host_col)} built on the ${HOST} (scratch, not in the arena)</td></tr>` : "");
  } else {
    h += `<tr><td>AIE</td><td>not dispatched to the AIE (${esc(o.impl)})${o.kind === "convolution" && g.groups > 1 && g.N < 8 ? ": " + g.N + " output channel(s) per group < RT_MIN_GROUP_N 8" : ""}</td></tr>`;
  }
  return h + "</table>";
}
function opcodeText(o) { return [...new Set(o.opcodes.map(c => c.opcodes.join("/")))].join("+").replace(/ /g, ""); }
const MODEHELP = m => (D.megakernel.modes.find(x => x.mode === m) || {}).what || "";
function whereRuns(o) {
  if (o.place !== "aie") return `<p class="note">Runs on the <b>${HOST} host CPU</b> as <span class="mono">${esc(o.impl)}</span>; reads and writes the DDR buffers below directly.</p>`;
  const parts = o.impl.split("+"), steps = [];

  const W = Math.max(760, Math.min(1400, (document.getElementById("view").clientWidth || 900) - 40)), H = 380, ml = 70, mb = 26;
  P.innerHTML = `<h2>Where data lives between ops</h2>
    <p class="note">DDR activation arena (${fb(D.memory.arena)}), planned by <span class="mono">dnn_torch._plan_memory</span>: one rectangle per buffer, from the op that first touches it to its last use (x = op index) at its arena offset (y). Buffers are reused after their last use. Views (reshape / flatten) share their root's bytes.</p>
    <div class="legend">${Object.keys(DTC).map(k => `<span><span class="sw" style="background:${DTC[k]}"></span>${k}</span>`).join("")}<span><span class="sw" style="background:var(--s-other)"></span>other</span></div>
    <svg id="memsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"></svg><h3>Constant + input blob (${fb(D.memory.blob)}, INCBIN'd)</h3><div id="blobtab"></div>`;
  const svg = document.getElementById("memsvg"), pw = W - ml - 10, ph = H - mb - 10;
  const sx = i => ml + (i / Math.max(n, 1)) * pw, sy = o => 10 + (o / arena) * ph;
  for (let k = 0; k <= 4; k++) {
    const o = arena * k / 4;
    el("line", {x1: ml, x2: ml + pw, y1: sy(o), y2: sy(o), stroke: "var(--grid)"}, svg);
    el("text", {x: ml - 6, y: sy(o) + 4, "text-anchor": "end", "font-size": 10, fill: "var(--text-secondary)"}, svg).textContent = fb(o);
  }
  for (let k = 0; k <= 5; k++) {
    const i = Math.round(n * k / 5);
    el("text", {x: sx(i), y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "var(--text-secondary)"}, svg).textContent = "op " + i;
  }
  el("line", {id: "memcur", x1: 0, x2: 0, y1: 10, y2: 10 + ph, stroke: "var(--sel)", "stroke-width": 1, visibility: "hidden"}, svg);
  D.tensors.filter(t => t.base == null && t.loc.space === "arena" && t.life[0] >= 0).forEach(t => {
    const x0 = sx(t.life[0]), x1 = sx(Math.min(t.life[1], n) + 1);
    const r = el("rect", {x: x0, y: sy(t.loc.off), width: Math.max(1.5, x1 - x0), height: Math.max(1.5, sy(t.loc.off + t.loc.size) - sy(t.loc.off)),
      fill: DTC[t.dt] || "var(--s-other)", "fill-opacity": .75, class: "memrect", id: "m" + t.id}, svg);
    const pi = D.ops.findIndex(o => T(o.out).root === t.id);
    el("title", {}, r).textContent = `t${t.id} ${shp(t)} ${t.dt} ${fb(t.bytes)}\narena @${fn(t.loc.off)} +${fb(t.loc.size)}\nlive ops ${t.life[0]}..${t.life[1]}` + (pi >= 0 ? `\nwritten by #${pi} ${D.ops[pi].name}` : "");
    if (pi >= 0) r.addEventListener("click", () => select(pi, true));
  });
  const owner = {};
  D.ops.forEach((o, i) => o.args.forEach(a => { if (a.role === "const") (owner[T(a.t).root] = owner[T(a.t).root] || []).push(i); }));
  const rows = D.tensors.filter(t => t.base == null && (t.loc.space === "blob" || t.loc.space === "input")).sort((a, b) => b.bytes - a.bytes);
  const shown = rows.slice(0, 40);
  document.getElementById("blobtab").innerHTML = `<table><tr><th>tensor</th><th class="n">offset</th><th class="n">bytes</th><th>used by</th></tr>` +
    shown.map(t => `<tr><td class="mono">t${t.id} ${shp(t)} ${t.dt}${t.kind === "input" ? " (model input)" : ""}</td><td class="n">${fn(t.loc.off)}</td><td class="n">${fb(t.bytes)}</td><td>${(owner[t.id] || []).slice(0, 3).map(oplink).join(", ")}</td></tr>`).join("") +
    `</table>${rows.length > shown.length ? `<p class="note">${rows.length - shown.length} smaller constants not listed (${rows.length} total).</p>` : ""}`;
  bindLinks(P);
}
function memHighlight() {
  document.querySelectorAll(".memrect.hl").forEach(r => r.classList.remove("hl"));
  const cur = document.getElementById("memcur"); if (!cur) return;
  if (sel < 0) { cur.setAttribute("visibility", "hidden"); return; }
  const o = D.ops[sel];
  o.args.forEach(a => { const r = document.getElementById("m" + T(a.t).root); if (r) r.classList.add("hl"); });
  const svg = document.getElementById("memsvg"), W = +svg.getAttribute("width"), pw = W - 80;
  const x = 70 + ((sel + 0.5) / D.ops.length) * pw;
  cur.setAttribute("x1", x); cur.setAttribute("x2", x); cur.setAttribute("visibility", "visible");
}

/* ── summary ────────────────────────────────────────────────────────── */
function mkView() {
  const M = D.megakernel, B = M.build, P = document.getElementById("pane-mk");
  const pill = c => c === true ? '<span class="pill on">in</span>' : c === false ? '<span class="pill off">out</span>' : '<span class="pill na">n/a</span>';
  const links = ids => ids.length ? `${ids.length}: ` + ids.slice(0, 8).map(oplink).join(", ") + (ids.length > 8 ? ", …" : "") : "-";
  let h = `<h2>GEMM megakernel</h2><p class="note">One persistent kernel ELF (<span class="mono">${esc(M.source)}</span>) is loaded once; every AIE op is a <b>mode</b> of it, picked per launch by the <b>opcode</b> in byte 0 of the B block's row 127. A board build compiles only the modes the model calls (dnn_build modes="auto": the app first runs in workstation emulation with every entry counted; <span class="mono">aie_modes_cfg.h</span> turns the rest off and the host's implementation list drops their entries).</p>`;
  if (B.dir) {
    h += `<table class="kv"><tr><td>board build</td><td class="mono">${esc(B.dir)}</td></tr>` +
      `<tr><td>modes compiled</td><td>${B.modes ? Object.entries(B.modes).map(([k, v]) => `${esc(k)} ${pill(v)}`).join(" ") + ` <span class="note">(${esc(B.cfg)})</span>` : "every mode (no per-app aie_modes_cfg.h: modes=all or an older build)"}</td></tr>`;
    if (B.pm_bytes) h += `<tr><td>core program memory</td><td><span class="pmbox"><span class="pmbar" style="width:${(240 * B.pm_bytes / B.pm_total).toFixed(0)}px"></span></span> ${fb(B.pm_bytes)} of ${fb(B.pm_total)}${B.pm_kernel_bytes ? ` (kernel.o ${fb(B.pm_kernel_bytes)})` : ""}</td></tr>`;
    h += "</table>";
  } else h += `<p class="note">No board build next to this page's board log: "compiled" is not known (n/a).</p>`;
  if (!M.counted) h += `<p class="warn">Per-op calls were not counted for this page (an AiednnLib without counting): the op columns below are empty.</p>`;
  h += `<h3>Modes and opcodes</h3><table><tr><th>mode</th><th>opcode</th><th>compiled</th><th>switch</th><th>what the cores do</th><th>entries</th><th>ops in this model</th><th class="n">entry calls (emulation; n-tile / MMT: per-layer)</th></tr>` +
    M.modes.map(m => `<tr><td><b>${esc(m.mode)}</b></td><td><span class="opc">${esc(m.opcode)}</span></td><td>${pill(m.compiled)}</td><td class="mono">${esc(m.macro)}</td><td>${esc(m.what)}</td><td class="mono">${m.entries.map(esc).join("<br>")}</td><td>${links(m.ops)}</td><td class="n">${m.launches ? fn(m.launches) : "-"}</td></tr>`).join("") + "</table>";
  h += `<h3>Entries (host side: one AIEK_ENTRY per launch kind)</h3><table><tr><th>entry</th><th>opcodes</th><th>composites that call it</th><th>ops</th><th class="n">calls (this page)</th><th class="n">calls (board build's emulation run)</th></tr>` +
    M.entries.map(e => `<tr><td class="mono">${esc(e.entry)}</td><td>${e.opcodes.map(x => `<span class="opc">${esc(x)}</span>`).join(" / ")}</td><td class="mono">${e.impls.map(esc).join("<br>") || "-"}</td><td>${links(e.ops)}</td><td class="n">${e.calls ? fn(e.calls) : "-"}</td><td class="n">${e.board_usage != null ? fn(e.board_usage) : "-"}</td></tr>`).join("") + "</table>";
  h += `<h3>Op → opcode map</h3><table><tr><th class="n">#</th><th>op</th><th>impl</th><th>fused</th><th>opcodes (calls)</th><th>epilogue</th></tr>` +
    D.ops.filter(o => o.place === "aie").map(o => `<tr><td class="n">${o.i}</td><td>${oplink(o.i)}</td><td class="mono">${esc(o.impl)}</td><td>${o.fused.length || "-"}</td><td>${o.opcodes.map(c => c.opcodes.map(x => `<span class="opc">${esc(x)}</span>`).join("/") + ` ${esc(c.entry)} ×${fn(c.calls)}`).join("<br>") || "-"}</td><td>${o.epilogue === "aie-core" ? "AIE core" : o.epilogue === "host" ? HOST : "-"}</td></tr>`).join("") + "</table>";
  P.innerHTML = h; bindLinks(P);
}
function sumView() {
  const S = D.summary, B = D.board, P = document.getElementById("pane-sum");
  const useBoard = D.time_source === "board";
  const tkey = e => useBoard ? (e.board_ms || 0) : e.x86_ms;
  const tmax = Math.max(1e-9, ...S.impls.map(tkey)), ttot = S.impls.reduce((a, e) => a + tkey(e), 0) || 1;
  let h = `<h2>Per implementation</h2><p class="note">Time bars: ${useBoard ? "board PROF lines (primitive execution only)" : D.time_source === "x86" ? "workstation emulation (not board time)" : "no timing"}. Launches: estimated from GEMM shapes${B && B.stats ? "; board column from aiednn_stats (composites count under blocked:)" : ""}.</p>
    <table><tr><th>implementation</th><th>where</th><th class="n">ops</th><th class="n">emulation</th><th class="n">board</th><th>share</th><th class="n">launches est.</th><th class="n">DDR→AIE</th><th class="n">AIE→DDR</th></tr>`;
  S.impls.forEach(e => {
    const w = 140 * tkey(e) / tmax;
    h += `<tr><td class="mono">${esc(e.impl)}</td><td><span class="pill ${e.place}">${e.place === "aie" ? "AIE" : "CPU"}</span></td><td class="n">${e.n}</td>` +
      `<td class="n">${D.time_source ? fms(e.x86_ms) : "-"}</td><td class="n">${e.board_ms != null ? fms(e.board_ms) : "-"}</td>` +
      `<td><span class="hbar" style="width:${w.toFixed(1)}px;background:${e.place === "aie" ? "var(--aie)" : "var(--cpu)"}"></span> <span class="note">${(100 * tkey(e) / ttot).toFixed(1)}%</span></td>` +
      `<td class="n">${e.launches ? fn(e.launches) : "-"}</td><td class="n">${e.dma_in ? fb(e.dma_in) : "-"}</td><td class="n">${e.dma_out ? fb(e.dma_out) : "-"}</td></tr>`;
  });
  h += "</table>";
  if (B) {
    h += `<h2>Board run</h2><p class="note mono">${esc(B.path)}</p><table class="kv">`;
    if (B.model) h += `<tr><td>MODEL</td><td>${B.model.ops} ops, ${fms(B.model.time_ms)}, rel ${B.model.relerr.toExponential(2)}, top-1 ${B.model.top1} (ref ${B.model.ref_top1}), AIE layers checked on device ${B.model.gemm_checked - B.model.gemm_bad}/${B.model.gemm_checked}</td></tr>`;
    h += `<tr><td>result</td><td>${B.passed ? "PASS" : "not PASS"}</td></tr>`;
    if (B.kernel) h += `<tr><td>${esc(B.kernel.name)} entry</td><td>${fn(B.kernel.calls)} calls: copy-in ${fms(B.kernel.copy_in_ms)}, launch ${fms(B.kernel.launch_ms)}, copy-out ${fms(B.kernel.copy_out_ms)}</td></tr>`;
    h += `</table><h3>aiednn_stats (includes the on-device ref: verification re-runs)</h3><table><tr><th>implementation</th><th class="n">execs</th><th class="n">AIE launches</th></tr>` +
      Object.entries(B.stats).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="n">${v.execs}</td><td class="n">${fn(v.launches)}</td></tr>`).join("") + "</table>";
  }
  h += `<h2>All ops</h2><table id="sumtab"><tr><th class="n">#</th><th>name</th><th>kind</th><th>impl</th><th>out</th><th class="n">in</th><th class="n">const</th><th class="n">out</th><th class="n">launches</th><th class="n">emulation</th></tr>` +
    D.ops.map((o, i) => `<tr data-op="${i}"><td class="n">${i}</td><td>${oplink(i)}</td><td>${esc(o.kind)}</td><td class="mono">${esc(o.impl)}</td><td class="mono">${shp(T(o.out))} ${T(o.out).dt}</td><td class="n">${fb(o.in_bytes)}</td><td class="n">${o.const_bytes ? fb(o.const_bytes) : "-"}</td><td class="n">${fb(o.out_bytes)}</td><td class="n">${o.gemm && o.gemm.launches ? fn(o.gemm.launches) : "-"}</td><td class="n">${fms(o.t_ms)}</td></tr>`).join("") + "</table>";
  h += `<h2>Sources</h2><ul class="note"><li>graph, tensors, arena offsets: <span class="mono">aiegraph.dnn_torch</span> (lower, _plan_memory; blob order as emit_app)</li>
    <li>launch / byte estimates: <span class="mono">${esc(D.aie.block.source)}</span> + <span class="mono">src/aiednn/aiednn_rt_gemm.h</span> (blocked_gemm, im2col+, col2im+)</li>
    <li>device geometry: ${esc(D.aie.device.source)}</li><li>tile placement: ${esc(D.aie.placement)}</li></ul>`;
  P.innerHTML = h; bindLinks(P);
}

/* ── wiring ─────────────────────────────────────────────────────────── */
function init() {
  header(); flow(); aieView(); memView(); mkView(); sumView(); details(-1); aieOp();
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.tab));
  }));
  document.querySelectorAll("#chips button").forEach(b => b.addEventListener("click", () => {
    filt = b.dataset.f;
    document.querySelectorAll("#chips button").forEach(x => x.classList.toggle("on", x === b));
    refilter();
  }));
  const q = document.getElementById("q");
  q.addEventListener("input", refilter);
  q.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !matches.length) return;
    const nx = matches.find(i => i > sel); select(nx != null ? nx : matches[0], true);
  });
  document.addEventListener("keydown", e => {
    if (e.target === q) return;
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); select(Math.min(D.ops.length - 1, sel + 1), true); }
    if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); select(Math.max(0, sel - 1), true); }
  });
  document.getElementById("zin").onclick = () => { zoom = Math.min(3, zoom * 1.25); applyZoom(); };
  document.getElementById("zout").onclick = () => { zoom = Math.max(0.15, zoom / 1.25); applyZoom(); };
  document.getElementById("z1").onclick = () => { zoom = 1; applyZoom(); };
  document.getElementById("zfit").onclick = () => {
    const svg = document.getElementById("flow");
    zoom = Math.min(1, (document.getElementById("view").clientWidth - 20) / svg.dataset.w); applyZoom();
  };
  refilter();
}
init();
</script>
</body>
</html>
