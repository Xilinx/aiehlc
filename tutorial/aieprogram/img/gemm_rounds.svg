<text x='479.0' y='254.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#222' font-weight='normal'>before the loop:  y = store_buffer(c, {pm*16, pn*16}, {16, 16})</text>
