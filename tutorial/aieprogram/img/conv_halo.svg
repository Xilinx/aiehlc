<text x='659.0' y='103.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'>rows:  19 - 14 = 5</text>
<text x='659.0' y='120.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'>cols:  61 - 56 = 5</text>
<text x='659.0' y='137.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'></text>
<text x='659.0' y='154.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='bold'>step = output block * stride</text>
<text x='659.0' y='171.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'>rows:  7 * 2 = 14</text>
<text x='659.0' y='188.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'>cols:  28 * 2 = 56</text>
<text x='659.0' y='205.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'></text>
<text x='659.0' y='222.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#8b0000' font-weight='bold'>halo bytes are sent twice:</text>
<text x='659.0' y='239.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#8b0000' font-weight='normal'>each round gets its whole slab</text>
<text x='659.0' y='256.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'></text>
<text x='659.0' y='273.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='bold'>mesh row pid_h starts at</text>
<text x='659.0' y='290.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='start' fill='#222' font-weight='normal'>input row 56 * pid_h</text>
<text x='480.0' y='345.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#a0522d' font-weight='normal'>The compiler reads exactly this from the trace: block (19,61,4), core offset (56,0,0)*p0, rounds 4x4, steps (14,0,0) / (0,56,0)</text>
