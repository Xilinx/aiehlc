<text x='94.0' y='129.9' font-family='DejaVu Sans, Arial, sans-serif' font-size='10' text-anchor='end' fill='#666' font-weight='normal'>(7-1)*2+7</text>
<line x1='70.0' y1='138.8' x2='106.0' y2='138.8' stroke='#333' stroke-width='1' stroke-dasharray='3,2'/>
