<text x='236.0' y='276.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#222' font-weight='bold'>61 columns = (28-1)*2+7</text>
<line x1='345.2' y1='252.0' x2='345.2' y2='288.0' stroke='#333' stroke-width='1' stroke-dasharray='3,2'/>
<text x='349.2' y='296.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='10' text-anchor='start' fill='#666' font-weight='normal'>next block starts at column 56</text>
