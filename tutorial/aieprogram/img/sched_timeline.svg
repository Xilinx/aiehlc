<text x='530.0' y='380.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#666' font-weight='normal'>Illustrative timing (not to scale). The kernel code is identical in every case: options configure the DMA and the buffers, not the compute.</text>
